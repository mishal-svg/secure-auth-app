
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>

    <div class="container">

        <div class="logo">AS</div>

        <h2>Welcome</h2>

        <p class="subtitle">
            Secure Access, Simple & Reliable
        </p>

        <div id="guestSection">

            <p class="profile-email">
                Please login to access your profile.
            </p>

            <button onclick="window.location.href='/login.html'">
                Login
            </button>

            <button
                onclick="window.location.href='/register.html'"
                class="register-btn"
            >
                Create Account
            </button>

        </div>

        <div id="profileSection" style="display: none;">

            <div class="profile-card">

                <div class="profile-icon">
                    👤
                </div>

                <div id="message" class="profile-email">
                    Loading...
                </div>

            </div>

            <button id="logoutBtn" class="logout">
                Logout
            </button>

        </div>

    </div>

    <script>

        async function loadProfile() {

            const token = localStorage.getItem("token");

            if (!token) {
                document.getElementById("guestSection").style.display = "block";
                document.getElementById("profileSection").style.display = "none";
                return;
            }

            try {

                const response = await fetch("/api/profile", {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (response.ok) {

                    document.getElementById("guestSection").style.display = "none";
                    document.getElementById("profileSection").style.display = "block";

                    document.getElementById("message").innerHTML = `
                        <strong>${data.user.email}</strong>
                        <span class="role">${data.user.role}</span>
                    `;

                } else {

                    localStorage.removeItem("token");

                    document.getElementById("guestSection").style.display = "block";
                    document.getElementById("profileSection").style.display = "none";
                }

            } catch (error) {

                document.getElementById("guestSection").style.display = "block";
                document.getElementById("profileSection").style.display = "none";
            }
        }

        document
            .getElementById("logoutBtn")
            .addEventListener("click", () => {

                localStorage.removeItem("token");

                loadProfile();
            });

        loadProfile();

    </script>

</body>
</html>
